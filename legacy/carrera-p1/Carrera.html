<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carrera política</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepto: sala de control de una noche electoral. Paneles oscuros, números grandes tipo rotulación de televisión, el color lo ponen los partidos. */
:root{
  --bg:#0A0F1E; --bg2:#0E1530; --panel:#131C3A; --panel2:#18234A; --line:#27335F;
  --fg:#E9EDF9; --mut:#93A0C8; --dim:#5D6A96; --acc:#FFC93C; --acc-ink:#1A1400;
  --good:#43D18B; --bad:#FF5C6C;
  --f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 80% -10%,#1a2760 0%,transparent 60%),radial-gradient(900px 400px at -10% 10%,#2a1850 0%,transparent 55%);
  background-attachment:fixed;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:.01em;line-height:1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .dim{color:var(--dim)}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,15,30,.88);backdrop-filter:blur(10px);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:58px}
.brand{font-family:var(--f-disp);font-weight:900;font-size:26px;letter-spacing:.04em;display:flex;align-items:center;gap:10px;white-space:nowrap;background:none;border:0;padding:0}
.brand i{display:inline-block;width:26px;height:13px;border-radius:26px 26px 0 0;background:conic-gradient(from 270deg at 50% 100%,#E4237F 0 25%,#E1253B 0 40%,#FFC93C 0 52%,#1F8FE0 0 80%,#74C22F 0 100%);}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mut);font-weight:600;white-space:nowrap}
nav button:hover{color:var(--fg);background:var(--panel)}
nav button[aria-current="true"]{color:var(--acc-ink);background:var(--acc)}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--mut);white-space:nowrap}
.clock b{color:var(--acc);font-weight:500}

main{padding-block:26px 10px}
.view[hidden]{display:none}

/* piezas */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel.flat{background:transparent}
.h-sec{font-size:30px;margin-bottom:4px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--mut)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut);background:var(--bg2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
select,input[type=number],input[type=text]{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
select{max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.2fr);gap:28px;align-items:center;padding-block:10px 24px}
.hero h1{font-size:clamp(54px,8.5vw,112px);font-weight:900;line-height:.88;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{max-width:46ch;color:var(--mut);font-size:17px;margin:16px 0 22px}
.count{display:flex;gap:10px;margin-bottom:22px}
.count div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:center;min-width:74px}
.count b{display:block;font-family:var(--f-disp);font-size:38px;line-height:1}
.count span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.hero-hemi{background:linear-gradient(180deg,rgba(19,28,58,.9),rgba(19,28,58,.5));border:1px solid var(--line);border-radius:18px;padding:16px 14px 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:8px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--f-mono);font-weight:500}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:8px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:170px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.mode:hover{border-color:var(--acc);transform:translateY(-2px)}
.mode h3{font-size:28px;text-transform:uppercase}
.mode p{margin:0;color:var(--mut);font-size:14px}
.mode .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--acc);text-transform:uppercase}
.mode .go{margin-top:auto;font-weight:700;color:var(--acc)}
.sources{font-size:12.5px;color:var(--dim);margin-top:26px;line-height:1.7}
.sources a{color:var(--mut)}

/* simulador */
.sim{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:18px;align-items:start}
.ctrl{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));max-height:calc(100vh - 90px);overflow:auto;scrollbar-width:thin}
.ctrl .panel{padding:14px}
.prow{display:grid;grid-template-columns:12px minmax(0,1fr) 54px 26px;gap:8px;align-items:center;padding:5px 0}
.prow label{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .val{font-family:var(--f-mono);font-size:13px;text-align:right}
.prow .lock{background:none;border:0;opacity:.35;font-size:13px;padding:2px;line-height:1}
.prow .lock[aria-pressed="true"]{opacity:1;color:var(--acc)}
.prow .seatmini{grid-column:2/4;font-family:var(--f-mono);font-size:11px;color:var(--mut);margin-top:-4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:var(--line);outline-offset:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--pc,#fff);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--pc,#fff)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--pc,#fff);border:3px solid var(--bg)}
.sumline{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--mut);padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-family:var(--f-mono)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:var(--bg2);border:0;padding:7px 6px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.big-hemi{position:relative}
.hemi-center{position:absolute;left:0;right:0;bottom:6%;text-align:center;pointer-events:none}
.hemi-center b{display:block;font-family:var(--f-disp);font-size:clamp(44px,7vw,78px);line-height:.9}
.hemi-center span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.seat-table{width:100%;border-collapse:collapse;font-size:14px}
.seat-table th{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;padding:4px 8px}
.seat-table th:first-child{text-align:left}
.seat-table td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono)}
.seat-table td:first-child{text-align:left;font-family:var(--f-body);font-weight:600}
.seat-table .bar{display:inline-block;height:8px;border-radius:4px;vertical-align:middle;margin-right:6px}
.tw{overflow-x:auto}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.blocs{display:flex;flex-direction:column;gap:12px}
.bloc .bl{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:5px}
.bloc .bl b{font-family:var(--f-disp);font-size:26px;line-height:1}
.track{position:relative;height:22px;background:var(--bg2);border-radius:6px;display:flex;overflow:visible}
.track i{display:block;height:100%}
.track i:first-child{border-radius:6px 0 0 6px}
.track .m176{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--acc);left:50.286%}
.track .m176::after{content:"176";position:absolute;top:-16px;left:-12px;font-family:var(--f-mono);font-size:11px;color:var(--acc)}
.probs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.prob{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.prob b{display:block;font-family:var(--f-disp);font-size:36px;line-height:1}
.prob span{font-size:12px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.tile{aspect-ratio:1/.88;border-radius:6px;border:0;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px;text-shadow:0 1px 2px rgba(0,0,0,.45);transition:background .35s,transform .15s;position:relative;min-width:0}
.tile:hover{transform:scale(1.12);z-index:3}
.tile[aria-pressed="true"]{outline:2px solid var(--acc);z-index:2}
.tile small{font-size:9px;opacity:.9}
.tile.empty{background:var(--bg2)!important;color:var(--dim);text-shadow:none}
.tile.blank{visibility:hidden}
.pdetail h3{font-size:30px}
.pbars .pb{display:grid;grid-template-columns:90px minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:13px;padding:2px 0}
.pb .t{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.pb .t i{display:block;height:100%}
.pb .n{font-family:var(--f-mono);text-align:right;font-size:12px}
.ovr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin-top:10px}
.ovr label{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}

/* histórico */
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.timeline button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:76px;text-align:center}
.timeline button b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1}
.timeline button span{font-size:11px;color:var(--mut)}
.timeline button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.timeline button[aria-pressed="true"] span{color:#5a4800}
.hist{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:14px}
.chart text{fill:var(--mut);font-family:var(--f-mono);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.fact{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.fact b{display:block;font-family:var(--f-disp);font-size:28px;line-height:1.05}
.fact span{font-size:11.5px;color:var(--mut)}

/* campaña */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--pc)}
.pick:hover{border-color:var(--pc)}
.pick h3{font-size:30px}
.pick .diff{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.pick p{margin:0;font-size:13.5px;color:var(--mut)}
.game{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hud .fact{flex:1;min-width:110px}
.ap{display:flex;gap:6px;align-items:center}
.ap i{width:16px;height:16px;border-radius:50%;background:var(--acc);display:inline-block;transition:opacity .2s}
.ap i.off{opacity:.18}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.act{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.act:hover:not([disabled]){border-color:var(--acc)}
.act[disabled]{opacity:.38;pointer-events:none}
.act b{font-size:15px}
.act span{font-size:12.5px;color:var(--mut)}
.act .cost{font-family:var(--f-mono);font-size:11px;color:var(--acc)}
.log{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{padding:7px 10px;background:var(--bg2);border-radius:8px;border-left:3px solid var(--line)}
.log .good{border-left-color:var(--good)} .log .bad{border-left-color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.78);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.modal h3{font-size:34px;margin-bottom:8px}
.modal .opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.modal .opts button{text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.modal .opts button:hover{border-color:var(--acc)}
.modal .opts b{display:block}
.modal .opts span{font-size:13px;color:var(--mut)}

/* pactos */
.stance{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.stance:first-child{border-top:0}
.stance .seg{min-width:164px}
.verdict{border-radius:14px;padding:16px 18px;border:1px solid var(--line);background:var(--bg2)}
.verdict h3{font-size:38px}
.verdict.ok{border-color:var(--good)} .verdict.ok h3{color:var(--good)}
.verdict.ko{border-color:var(--bad)} .verdict.ko h3{color:var(--bad)}
.verdict.mid{border-color:var(--acc)} .verdict.mid h3{color:var(--acc)}

/* noche */
.night-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.pct{font-family:var(--f-disp);font-size:78px;font-weight:900;line-height:.85}
.pct small{font-size:30px;color:var(--mut)}
.progress{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.ticker{font-family:var(--f-mono);font-size:12.5px;color:var(--mut);min-height:20px}
.ticker b{color:var(--fg)}
.night{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.scorebox{display:flex;flex-direction:column;gap:8px}
.score{display:grid;grid-template-columns:12px minmax(0,1fr) 46px;gap:8px;align-items:center}
.score .st{height:20px;background:var(--bg2);border-radius:5px;overflow:hidden}
.score .st i{display:block;height:100%;transition:width .4s}
.score b{font-family:var(--f-disp);font-size:26px;text-align:right;line-height:1}

.note{font-size:12.5px;color:var(--mut);line-height:1.55}
.badge-model{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;padding:2px 7px;border-radius:5px;background:var(--bg2);border:1px solid var(--line);color:var(--mut);text-transform:uppercase}

@media (max-width:1020px){
  .hero{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr}
  .ctrl{position:static;max-height:none}
  .hist,.game,.night{grid-template-columns:1fr}
}
@media (max-width:560px){
  .clock{display:none}
  .grid2{grid-template-columns:1fr}
  .stance{grid-template-columns:12px minmax(0,1fr)}
  .stance .seg{grid-column:1/-1}
  .pct{font-size:58px}
  .tile{font-size:9px}.tile small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== CARRERA ===== */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pick{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--pc,var(--acc));border-radius:12px;padding:12px 14px;color:var(--fg);display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .12s}
.pick:hover{transform:translateY(-2px)}
.pick[aria-pressed="true"]{border-color:var(--pc);background:var(--panel2);box-shadow:0 0 0 2px var(--pc) inset}
.pick h3{font-size:26px}.pick p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.rowline{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.rowline:last-child{border:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
summary{cursor:pointer;color:var(--mut);font-size:13px}
details p{margin:6px 0 0;color:var(--mut);font-size:14px}

.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:860px){.gwrap{grid-template-columns:1fr}}
.gcard{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px;margin-top:8px;touch-action:pan-y;user-select:none;transition:transform .18s,border-color .15s}
.gcard h3{font-size:36px;margin:8px 0 4px}
.gc-fig{display:flex;justify-content:center}
.gopts{display:grid;gap:10px;margin-top:16px}
.gopts.three{grid-template-columns:repeat(3,minmax(0,1fr))}.gopts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.gopts.three,.gopts.two{grid-template-columns:1fr}}
.gopt{border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);text-align:left;background:var(--bg2);display:flex;flex-direction:column;gap:3px;font-size:15px}
.gopt small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.gopt.obey{border-color:#2E6BC9}.gopt.obey:hover{background:#12254a}

.stat .t,.nb .t{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}.stat .t i,.nb .t i{display:block;height:100%;border-radius:99px;transition:width .3s}

.lad,.lrow{display:grid;grid-template-columns:24px 30px minmax(0,1fr) 12px;gap:8px;align-items:center;padding:3px 6px;border-radius:8px;font-size:13px}

function buildHist(h){
  const arr = h.p.map(([id,share,seats])=>({id,share,seats,name:(h.names&&h.names[id])||null}));
  const sh = arr.reduce((a,x)=>a+x.share,0), se = arr.reduce((a,x)=>a+x.seats,0);
  arr.push({id:'OTROS',share:Math.max(0.2,+(100-sh).toFixed(2)),seats:TOTAL_SEATS-se,name:null});
  return {key:h.k,label:h.label,date:h.date,turnout:h.turnout,gov:h.gov,official:true,parties:arr};
}

    case 'vox': return b.vox;
    case 'su': return b.su;
    case 'pod': return P.cat?0.01:b.su;
    case 'ucd': return .75*b.pp+.25*b.psoe;
    case 'cs': return .55*b.pp+.45*b.psoe;
    case 'salf': return 1;
    case 'otros': return b.ot;
    default: return b[key]||0;
  }
}

/* Ajuste proporcional iterativo: provincias suman 100 y el voto nacional (ponderado) coincide con los objetivos */
function fitProvinces(ctxParties, shares, iters){
  iters = iters||40;
  const ids = ctxParties.map(p=>p.id);
  const wsum = PROV.reduce((a,p)=>a+p.w,0);
  const X = PROV.map(P=>ids.map(id=>Math.max(1e-6, shapeVal(P,PT[id].shape)) * (shapeVal(P,PT[id].shape)<=0.001?0.0001:1)));
  const T = ids.map(id=>Math.max(0.0001, shares[id]||0));
  for(let it=0; it<iters; it++){
    for(let i=0;i<ids.length;i++){
      let cur=0; for(let p=0;p<PROV.length;p++) cur+=PROV[p].w*X[p][i];
      cur/=wsum; if(cur<=0) continue;
      const f=T[i]/cur; for(let p=0;p<PROV.length;p++) X[p][i]*=f;
    }
    for(let p=0;p<PROV.length;p++){
      let s=0; for(let i=0;i<ids.length;i++) s+=X[p][i];
      const f=100/s; for(let i=0;i<ids.length;i++) X[p][i]*=f;
    }
  }
  return {ids,X};
}

/* Reparto de escaños: métodos d'Hondt, Sainte-Laguë, Hare (restos mayores) */
function allocate(votes, n, method, thr){
  const ids=Object.keys(votes), tot=ids.reduce((a,i)=>a+votes[i],0);
  const elig=ids.filter(i=>votes[i]/tot*100>=thr && votes[i]>0);
  const out={}; ids.forEach(i=>out[i]=0);
  if(!elig.length||n<=0) return out;
  if(method==='hare'){
    const sum=elig.reduce((a,i)=>a+votes[i],0), q=sum/n;
    const rem=[]; let given=0;
    elig.forEach(i=>{const f=votes[i]/q; out[i]=Math.floor(f); given+=out[i]; rem.push([i,f-Math.floor(f)]);});
    rem.sort((a,b)=>b[1]-a[1]); for(let k=0;given<n;k++,given++) out[rem[k%rem.length][0]]++;
    return out;
  }
  const cand=[];
  elig.forEach(i=>{ for(let k=0;k<n;k++){ const d = method==='sainte' ? (k===0?1.4:2*k+1) : k+1; cand.push([votes[i]/d,i]); }});
  cand.sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<n;k++) out[cand[k][1]]++;
  return out;
}

/* Simulación completa */
function simulate(ctxParties, shares, opts){
  opts=opts||{}; const method=opts.method||'dhondt', thr=opts.thr==null?3:opts.thr, mode=opts.mode||'prov', ov=opts.ov||{};
  const {ids,X}=fitProvinces(ctxParties, shares, opts.iters||40);
  const seats={}; ids.forEach(i=>seats[i]=0);
  const prov=[];
  for(let p=0;p<PROV.length;p++){
    const P=PROV[p]; const row={}; let tot=0;
    ids.forEach((id,i)=>{ let v=X[p][i]; const o=ov[P.id]&&ov[P.id][id]; if(o) v=Math.max(0,v+o); row[id]=v; tot+=v; });
    ids.forEach(id=>row[id]=row[id]/tot*100);
    let ps={}; ids.forEach(i=>ps[i]=0);
    if(mode==='prov'){ ps=allocate(row,P.seats,method,thr); ids.forEach(i=>seats[i]+=ps[i]); }
    let win=ids[0]; ids.forEach(i=>{ if(row[i]>row[win]) win=i; });
    prov.push({id:P.id,shares:row,seats:ps,win});
  }
  let nat={}; const wsum=PROV.reduce((a,p)=>a+p.w,0);
  ids.forEach(id=>{ let s=0; prov.forEach((r,p)=>s+=PROV[p].w*r.shares[id]); nat[id]=s/wsum; });
  if(mode==='unica'){
    const a=allocate(nat,TOTAL_SEATS,method,thr); ids.forEach(i=>seats[i]=a[i]);
  }
  return {seats,prov,nat,mode};
}

/* Aleatoriedad con semilla (mulberry32). El juego usa un generador global que se puede fijar con setSeed().
   Las probabilidades usan un generador propio derivado de los datos: mismos datos, mismos números. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG=mulberry32((Date.now()^0x9E3779B9)>>>0);
function setSeed(n){RNG=mulberry32(n>>>0);}
function rnd(){return RNG();}
function hashShares(shares){let h=2166136261;Object.keys(shares).sort().forEach(k=>{const t=k+':'+Math.round(shares[k]*100)+';';for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619);}});return h>>>0;}

/* Ruido correlacionado para probabilidades */
function randn(r){r=r||rnd;let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function perturb(shares, sigma, r){
  const zD=randn(r), zI=randn(r); const out={}; let sum=0;
  Object.keys(shares).forEach(id=>{
    const b=PT[id].bloc; const zb=b==='D'?zD:b==='I'?zI:0;
    const sg=(shares[id]>10?1:1.7)*sigma;
    out[id]=shares[id]*Math.exp(sg*(0.55*zb+0.85*randn(r))); sum+=out[id];
  });
  Object.keys(out).forEach(id=>out[id]=out[id]/sum*100);
  return out;
}
function monteCarlo(ctxParties, shares, opts, N, sigma){
  N=N||200; sigma=sigma==null?0.07:sigma;
  const ids=ctxParties.map(p=>p.id); const runs=[]; const r=mulberry32((hashShares(shares)^Math.imul(N,2654435761))>>>0);
  for(let k=0;k<N;k++){ const s=perturb(shares,sigma,r); runs.push(simulate(ctxParties,s,Object.assign({},opts,{iters:25})).seats); }
  const stat={}; ids.forEach(id=>{ const v=runs.map(r=>r[id]).sort((a,b)=>a-b); stat[id]={lo:v[Math.floor(N*.1)],med:v[Math.floor(N*.5)],hi:v[Math.min(N-1,Math.floor(N*.9))]}; });
  const blocSum=(r,ids2)=>ids2.reduce((a,i)=>a+(r[i]||0),0);
  const pr=(fn)=>runs.filter(fn).length/N;
  const first=(r,id)=>ids.every(o=>o===id||(r[o]||0)<=(r[id]||0));
  return {stat,runs:N,
    ppFirst:pr(r=>first(r,'PP')),
    psoeFirst:pr(r=>first(r,'PSOE')),
    derecha:pr(r=>blocSum(r,['PP','VOX','UPN','CC','SALF','ALI'])>=176),
    ppVox:pr(r=>blocSum(r,['PP','VOX'])>=176),
    progresista:pr(r=>blocSum(r,['PSOE','FA','SU','POD','UP','ERC','JUNTS','BILDU','PNV','BNG','AA','CC'])>=176),
    izqEstricta:pr(r=>blocSum(r,['PSOE','FA','SU','POD','UP'])>=176)
  };
}

/* Investidura: primera votación mayoría absoluta; segunda, más síes que noes */
function investiture(seats, stance, cand){
  let yes=0,no=0,abs=0;
  Object.keys(seats).forEach(id=>{ const s=(id===cand)?'si':(stance[id]||'no'); if(s==='si')yes+=seats[id]; else if(s==='abs')abs+=seats[id]; else no+=seats[id]; });
  return {yes,no,abs,first:yes>=176,second:yes>no};
}

  return out;
}

function rivalsTurn(){

  });

  G.rivals.filter(r=>r.grudge>0&&!r.ally).forEach(r=>{
    if(grnd()<.18*r.grudge){
      if(grnd()<.5){applyDelta([-4,0,0,0]);G.last+=' · '+r.name.split(' ')[0]+' te la devuelve: habla mal de ti en la ejecutiva.';}
      else{applyDelta([0,0,0,-3]);G.last+=' · '+r.name.split(' ')[0]+' te la devuelve: filtra una foto tuya con la boca llena.';}

/* ===== ELECCIONES ===== */
function runElection(){
  const final=perturb(G.nat,.025,grnd); G.final=final; const res=runSim(final); const idx=provIdx(); const pr=res.prov[idx];
  const won=pr.seats[G.party]||0; const P=PROV[idx]; const V=P.w*1000; const votes={}; let elig=[];
  Object.keys(pr.shares).forEach(id=>{votes[id]=pr.shares[id]/100*V; if(pr.shares[id]>=3&&votes[id]>0)elig.push(id);});
  const cand=[]; elig.forEach(id=>{for(let k=1;k<=P.seats;k++)cand.push([votes[id]/k,id,k]);}); cand.sort((a,b)=>b[0]-a[0]);
  const qWin=cand[P.seats-1]?cand[P.seats-1][0]:0, qLose=cand[P.seats]?cand[P.seats][0]:0;
  const my=votes[G.party]||0; const p=G.pos; let margin,kind;
  if(elig.indexOf(G.party)<0){kind='umbral';margin=Math.max(0,Math.round(V*.03-my));}
  else if(p<=won){kind='dentro';margin=Math.max(1,Math.round(my-p*qLose));}
  else{kind='fuera';margin=Math.max(1,Math.round(p*qWin-my));}
  const z={};CTX.parties.forEach(q=>z[q.id]=gnorm());
  G.el={won:won,pos:p,elected:p<=won,seatsByParty:pr.seats,shares:pr.shares,national:res.seats,margin:margin,kind:kind,V:V,votes:votes,seatsTotal:P.seats,z:z};
  G.night={step:0}; G.phase='night';
}
function nightPartial(step){
  const el=G.el; const out={};let sum=0;
  Object.keys(el.shares).forEach(id=>{const f=1-step/10;out[id]=el.shares[id]*Math.exp((el.z[id]||0)*.22*f*f);sum+=out[id];});
  Object.keys(out).forEach(id=>out[id]=out[id]/sum*100);
  return out;
}
function finishNight(){G.night.step=10;G.phase='result';}
function resultNext(){
  if(G.el.elected){G.phase='end';G.done=true;G.out='diputado';recordRun();return;}
  if(G.leg>=MAX_LEG){G.phase='end';G.done=true;G.out='retiro';recordRun();return;}
  newLegislature();
}
function newLegislature(){
  const seatsWon=G.el.won;
  /* los rivales elegidos se van al Congreso; entran caras nuevas */
  const rk=G.list.slice(0,seatsWon); const out=G.rivals.filter(r=>rk.indexOf(r.id)>=0).length;
  G.rivals=G.rivals.filter(r=>rk.indexOf(r.id)<0);
  for(let i=0;i<out;i++)G.rivals.push(newRival(gpick(ARCH_KEYS),6));
  /* si te quedas cerca sube tu fama; si no, solo la experiencia */
  if(G.el.kind==='fuera'&&G.el.margin<2500)G.st.F=clamp(G.st.F+4,0,100);
  G.st.L=clamp(G.st.L*.92,0,100);G.st.B=clamp(G.st.B*.95,0,100);G.st.F=clamp(G.st.F*.92,0,100);
  G.hist.push({leg:G.leg,pos:G.pos,won:G.el.won,margin:G.el.margin,kind:G.el.kind});
  G.leg++;G.turn=1;G.camp=0;G.list=null;G.listNoise=null;G.pos=null;G.el=null;G.night=null;
  G.nat=Object.assign({},G.final);nextCard();
}
function finalScore(){

  return 500+(MAX_LEG-G.leg)*200+Math.round((G.st.L+G.st.B+G.st.F)/3)*2+Math.round(G.st.C);

/* ===== HEMICICLO ===== */
const HEMI=(function(){
  const rows=10,r0=.4,r1=1,N=TOTAL_SEATS;const radii=[];for(let k=0;k<rows;k++)radii.push(r0+(r1-r0)*k/(rows-1));
  const tot=radii.reduce((a,x)=>a+x,0);const counts=radii.map(r=>Math.round(N*r/tot));
  let diff=N-counts.reduce((a,x)=>a+x,0);for(let k=rows-1;diff!==0;k=(k+rows-1)%rows){counts[k]+=Math.sign(diff);diff-=Math.sign(diff);}
  const pts=[];counts.forEach((n,k)=>{for(let j=0;j<n;j++){pts.push({a:Math.PI*(1-(n===1?.5:j/(n-1))),r:radii[k]});}});
  pts.sort((x,y)=>y.a-x.a||x.r-y.r);return pts;
})();
function hemiSVG(seats,mine){
  const W=600,H=325,cx=300,cy=300,R=288;const order=CTX.parties.map(p=>p.id).filter(id=>(seats[id]||0)>0).sort((a,b)=>PT[a].lr-PT[b].lr);
  const colors=[];order.forEach(id=>{for(let k=0;k<seats[id];k++)colors.push(COL(id));});const rad=R*.6/9*.40;
  let out='<svg class="hemi" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Hemiciclo" style="width:100%;height:auto;display:block">';
  HEMI.forEach((p,i)=>{const x=cx+p.r*R*Math.cos(p.a),y=cy-p.r*R*Math.sin(p.a);const c=i<colors.length?colors[i]:'#27335F';
    out+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+rad.toFixed(1)+'" fill="'+c+'"'+(i>=colors.length?' opacity=".55"':'')+'/>';});
  return out+'</svg>';
}

function bindSwipe(){

  c.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;c.style.transform='translateX('+dx*.6+'px) rotate('+dx*.04+'deg)';c.style.borderColor=dx>40?'var(--good)':dx<-40?'var(--bad)':'';});
  const end=()=>{if(x0==null)return;const n=+c.dataset.swipe;const d=dx;x0=null;c.style.transform='';c.style.borderColor='';
    if(d>90)pickAnswer(0);else if(d<-90)pickAnswer(n===3?2:1);};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',()=>{x0=null;c.style.transform='';});

function nightTick(){
  if(!G||G.phase!=='night'){stopNight();return;}
  if(G.night.step<10){G.night.step++;render();}
  if(G.night.step>=10)stopNight();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return;
  if(t.dataset.pick){SETUP.party=t.dataset.pick;render();return;}
  const seg=t.closest('[data-seg="female"]'); if(seg){SETUP.female=t.dataset.v==='1';render();return;}
  const a=t.dataset.act; if(!a)return;
  switch(a){
    case 'start':startFromSetup();break;
    case 'continue':{const s=lsGet('carrera_save',null);if(s){G=s;render();}break;}
    case 'discard':lsSet('carrera_save',null);render();break;
    case 'ans':pickAnswer(+t.dataset.i);break;
    case 'do':if(doAction(t.dataset.id))render();break;
    case 'to-campaign':G.phase='campaign';render();break;
    case 'camp':if(doCampaign(t.dataset.id))render();break;
    case 'night-play':if(G.nightRun){stopNight();render();}else{G.nightRun=true;nightTimer=setInterval(nightTick,800);nightTick();}break;
    case 'night-skip':stopNight();G.night.step=10;render();break;
    case 'night-done':stopNight();finishNight();render();break;
    case 'res-next':resultNext();render();break;
    case 'copy':{const txt='Carrera política · '+G.name+' ('+PT[G.party].s+', '+PROV[provIdx()].name+') · '+(G.out==='diputado'?'Diputado/a en la legislatura '+G.leg+', puesto '+G.pos:'Sin escaño tras '+G.leg+' legislaturas')+' · '+finalScore()+' puntos';
      const done=()=>{t.textContent='Copiado';setTimeout(()=>t.textContent='Copiar resultado',1600);};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>{t.textContent='No se pudo copiar';});else t.textContent='No se pudo copiar';break;}
    case 'again':stopNight();lsSet('carrera_save',null);G=null;render();break;
    case 'home':stopNight();if(G&&!G.done){lsSet('carrera_save',G);}G=null;render();break;
  }
});
document.addEventListener('input',e=>{const t=e.target; if(t.id==='nameIn')SETUP.name=t.value; else if(t.id==='seedIn')SETUP.seed=t.value;});
document.addEventListener('change',e=>{const t=e.target; if(t.id==='provSel'){SETUP.prov=t.value;render();}});
document.addEventListener('keydown',e=>{
  if(!G||G.phase!=='card')return; if(e.target&&e.target.matches&&e.target.matches('input,select,textarea'))return;
  const isEv=CARD_BY_ID[G.card].kind==='evento';
  if(e.key==='ArrowRight')pickAnswer(0); else if(e.key==='ArrowLeft')pickAnswer(isEv?1:2); else if(e.key==='ArrowDown'&&!isEv)pickAnswer(1);
});
(function init(){render();})();

</script>
</body></html>
